<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="white">
  <!-- 十字准星（猎手标记） -->
  <circle cx="100" cy="100" r="50" fill="none" stroke="white" stroke-width="4" opacity="0.7"/>
  <line x1="100" y1="35" x2="100" y2="165" stroke="white" stroke-width="3" opacity="0.7"/>
  <line x1="35" y1="100" x2="165" y2="100" stroke="white" stroke-width="3" opacity="0.7"/>
  <!-- 中心圆 -->
  <circle cx="100" cy="100" r="8" fill="white" opacity="0.9"/>
  <!-- 对角线 -->
  <line x1="65" y1="65" x2="135" y2="135" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="135" y1="65" x2="65" y2="135" stroke="white" stroke-width="1" opacity="0.4"/>
  <!-- 节点连线（代表团伙网络） -->
  <circle cx="700" cy="100" r="5" fill="white" opacity="0.6"/>
  <circle cx="550" cy="160" r="5" fill="white" opacity="0.6"/>
  <circle cx="620" cy="50" r="5" fill="white" opacity="0.6"/>
  <circle cx="500" cy="250" r="5" fill="white" opacity="0.6"/>
  <circle cx="650" cy="280" r="5" fill="white" opacity="0.6"/>
  <circle cx="730" cy="200" r="5" fill="white" opacity="0.6"/>
  <circle cx="450" cy="180" r="5" fill="white" opacity="0.6"/>
  <line x1="700" y1="100" x2="550" y2="160" stroke="white" stroke-width="0.8" opacity="0.25"/>
  <line x1="700" y1="100" x2="620" y2="50" stroke="white" stroke-width="0.8" opacity="0.25"/>
  <line x1="700" y1="100" x2="730" y2="200" stroke="white" stroke-width="0.8" opacity="0.25"/>
  <line x1="700" y1="100" x2="650" y2="280" stroke="white" stroke-width="0.8" opacity="0.25"/>
  <line x1="550" y1="160" x2="500" y2="250" stroke="white" stroke-width="0.8" opacity="0.25"/>
  <line x1="550" y1="160" x2="450" y2="180" stroke="white" stroke-width="0.8" opacity="0.25"/>
  <line x1="620" y1="50" x2="450" y2="180" stroke="white" stroke-width="0.8" opacity="0.25"/>
  <!-- 超级团伙大节点 -->
  <circle cx="550" cy="400" r="18" fill="none" stroke="white" stroke-width="3" opacity="0.8"/>
  <circle cx="550" cy="400" r="8" fill="white" opacity="0.6"/>
  <!-- 中心大节点 -->
  <circle cx="320" cy="400" r="25" fill="none" stroke="white" stroke-width="4" opacity="0.85"/>
  <circle cx="320" cy="400" r="10" fill="white" opacity="0.7"/>
  <!-- 周围节点 -->
  <circle cx="180" cy="350" r="6" fill="white" opacity="0.5"/>
  <circle cx="140" cy="440" r="6" fill="white" opacity="0.5"/>
  <circle cx="240" cy="460" r="6" fill="white" opacity="0.5"/>
  <circle cx="400" cy="320" r="6" fill="white" opacity="0.5"/>
  <circle cx="430" cy="460" r="6" fill="white" opacity="0.5"/>
  <circle cx="310" cy="300" r="6" fill="white" opacity="0.5"/>
  <line x1="320" y1="400" x2="180" y2="350" stroke="white" stroke-width="1.2" opacity="0.3"/>
  <line x1="320" y1="400" x2="140" y2="440" stroke="white" stroke-width="1.2" opacity="0.3"/>
  <line x1="320" y1="400" x2="240" y2="460" stroke="white" stroke-width="1.2" opacity="0.3"/>
  <line x1="320" y1="400" x2="400" y2="320" stroke="white" stroke-width="1.2" opacity="0.3"/>
  <line x1="320" y1="400" x2="430" y2="460" stroke="white" stroke-width="1.2" opacity="0.3"/>
  <line x1="320" y1="400" x2="310" y2="300" stroke="white" stroke-width="1.2" opacity="0.3"/>
  <line x1="320" y1="400" x2="550" y2="400" stroke="white" stroke-width="1.5" opacity="0.35"/>
</svg>
