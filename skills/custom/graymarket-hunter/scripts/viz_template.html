<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闲鱼黑灰产团伙图谱</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#0d1117; color:#e6edf3; overflow:hidden; }
  #graph { width:100vw; height:100vh; cursor:grab; }
  #graph:active { cursor:grabbing; }

  /* 顶栏 */
  .topbar { position:fixed; top:0; left:0; right:0; height:54px; background:rgba(13,17,23,.92);
    backdrop-filter:blur(8px); border-bottom:1px solid #21262d; display:flex; align-items:center;
    padding:0 20px; gap:18px; z-index:10; }
  .topbar h1 { font-size:16px; font-weight:600; white-space:nowrap; }
  .topbar h1 .sub { font-size:12px; color:#8b949e; font-weight:400; margin-left:8px; }
  .stat { font-size:12px; color:#8b949e; }
  .stat b { color:#58a6ff; font-size:14px; }
  .spacer { flex:1; }
  .topbar input { background:#161b22; border:1px solid #30363d; color:#e6edf3; padding:6px 12px;
    border-radius:6px; font-size:13px; width:200px; outline:none; }
  .topbar input:focus { border-color:#58a6ff; }
  .legend { display:flex; gap:14px; font-size:12px; }
  .legend span { display:flex; align-items:center; gap:5px; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }

  /* 左侧团伙列表 */
  .sidebar { position:fixed; left:0; top:54px; bottom:0; width:280px; background:rgba(13,17,23,.85);
    border-right:1px solid #21262d; overflow-y:auto; z-index:9; padding:10px; }
  .sidebar h3 { font-size:12px; color:#8b949e; text-transform:uppercase; margin:8px 4px; letter-spacing:.5px; }
  .gang-card { background:#161b22; border:1px solid #21262d; border-radius:8px; padding:10px 12px;
    margin-bottom:8px; cursor:pointer; transition:.15s; border-left:3px solid #999; }
  .gang-card:hover { background:#1c2128; transform:translateX(2px); }
  .gang-card.active { background:#1f2937; border-color:#58a6ff; }
  .gang-card .name { font-size:13px; font-weight:600; margin-bottom:4px; }
  .gang-card .meta { font-size:11px; color:#8b949e; line-height:1.5; }
  .badge { display:inline-block; font-size:10px; padding:1px 6px; border-radius:4px; margin-right:4px; }

  /* 右侧详情面板 */
  .detail { position:fixed; right:0; top:54px; bottom:0; width:340px; background:rgba(13,17,23,.95);
    border-left:1px solid #21262d; overflow-y:auto; padding:18px; z-index:9; transform:translateX(100%);
    transition:transform .25s; }
  .detail.open { transform:translateX(0); }
  .detail .close { position:absolute; right:14px; top:14px; cursor:pointer; color:#8b949e; font-size:18px; }
  .detail h2 { font-size:17px; margin-bottom:6px; padding-right:24px; }
  .detail .risk-tag { font-size:12px; padding:2px 10px; border-radius:5px; display:inline-block; margin-bottom:12px; }
  .detail .field { margin-bottom:14px; }
  .detail .field .k { font-size:11px; color:#8b949e; text-transform:uppercase; margin-bottom:4px; letter-spacing:.5px; }
  .detail .field .v { font-size:13px; line-height:1.6; }
  .chip { display:inline-block; background:#21262d; padding:2px 8px; border-radius:4px; font-size:11px; margin:2px 3px 2px 0; }
  .seller-row { background:#161b22; border:1px solid #21262d; border-radius:6px; padding:8px 10px; margin-bottom:6px; }
  .seller-row .sname { font-size:12px; font-weight:600; color:#58a6ff; }
  .seller-row .stitle { font-size:11px; color:#8b949e; margin-top:3px; line-height:1.4; max-height:34px; overflow:hidden; }
  .seller-row a { color:#3fb950; font-size:11px; text-decoration:none; }
  .seller-row a:hover { text-decoration:underline; }

  /* 缩放控件 */
  .controls { position:fixed; right:18px; bottom:18px; display:flex; flex-direction:column; gap:6px; z-index:11; }
  .controls button { width:36px; height:36px; background:#161b22; border:1px solid #30363d; color:#e6edf3;
    border-radius:6px; cursor:pointer; font-size:18px; }
  .controls button:hover { background:#1c2128; }

  .node text { pointer-events:none; font-size:9px; fill:#c9d1d9; }
  .node.gang text { font-size:11px; font-weight:600; fill:#fff; }
  .link { stroke:#30363d; stroke-opacity:.5; }
  .link.samefp { stroke:#bc8cff; stroke-dasharray:3,3; stroke-opacity:.7; }
  .node circle { stroke:#0d1117; stroke-width:1.5px; cursor:pointer; }
  .node.dim { opacity:.12; }
  .link.dim { opacity:.04; }
</style>
</head>
<body>
<div class="topbar">
  <h1>🕵️ 闲鱼黑灰产团伙图谱 <span class="sub" id="sub"></span></h1>
  <span class="stat">卖家 <b id="s-sellers">0</b></span>
  <span class="stat">团伙 <b id="s-gangs">0</b></span>
  <span class="stat">关联边 <b id="s-edges">0</b></span>
  <div class="spacer"></div>
  <input id="search" placeholder="搜索卖家/团伙/业务…">
  <div class="legend">
    <span><i class="dot" style="background:#e74c3c"></i>高风险</span>
    <span><i class="dot" style="background:#f39c12"></i>中风险</span>
    <span><i class="dot" style="background:#bc8cff"></i>同图关联</span>
  </div>
</div>

<aside class="sidebar" id="sidebar"><h3>团伙列表（按规模）</h3></aside>
<aside class="detail" id="detail"></aside>
<svg id="graph"></svg>
<div class="controls">
  <button id="zoomin">+</button>
  <button id="zoomout">−</button>
  <button id="reset">⟲</button>
</div>

<script>
const GRAPH = /*__GRAPH_DATA__*/;
const RISK_COLOR = {"高":"#e74c3c","中":"#f39c12","低":"#27ae60"};

document.getElementById('s-sellers').textContent = GRAPH.summary.sellers;
document.getElementById('s-gangs').textContent = GRAPH.summary.gangs;
document.getElementById('s-edges').textContent = GRAPH.summary.edges;
const _sg = GRAPH.summary.shown_gangs || GRAPH.summary.gangs;
document.getElementById('sub').textContent = `共 ${GRAPH.summary.gangs} 团伙 / 展示 TOP ${_sg}`;

const W = window.innerWidth, H = window.innerHeight;
const svg = d3.select("#graph").attr("width", W).attr("height", H);
const g = svg.append("g");

const zoom = d3.zoom().scaleExtent([0.1, 6]).on("zoom", e => g.attr("transform", e.transform));
svg.call(zoom);

const links = GRAPH.links.map(d => Object.assign({}, d));
const nodes = GRAPH.nodes.map(d => Object.assign({}, d));

const sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(d => d.kind==="samefp"?120:40).strength(d=>d.kind==="samefp"?0.1:0.7))
  .force("charge", d3.forceManyBody().strength(d => d.type==="gang"?-400:-30))
  .force("center", d3.forceCenter(W/2, H/2))
  .force("collide", d3.forceCollide().radius(d => d.size+3));

const link = g.append("g").selectAll("line").data(links).join("line")
  .attr("class", d => "link "+(d.kind==="samefp"?"samefp":""));

const node = g.append("g").selectAll("g").data(nodes).join("g")
  .attr("class", d => "node "+d.type)
  .call(d3.drag()
    .on("start", (e,d)=>{ if(!e.active) sim.alphaTarget(.3).restart(); d.fx=d.x; d.fy=d.y; })
    .on("drag", (e,d)=>{ d.fx=e.x; d.fy=e.y; })
    .on("end", (e,d)=>{ if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }));

node.append("circle").attr("r", d=>d.size).attr("fill", d=>d.color)
  .attr("stroke", d=>d.type==="gang"?"#fff":"#0d1117").attr("stroke-width", d=>d.type==="gang"?2:1.5);

node.append("text").attr("dy", d=>d.type==="gang"?4:-d.size-3)
  .attr("text-anchor","middle")
  .text(d => d.type==="gang" ? d.label : (d.size>8?d.label:""));

node.on("click", (e,d)=>{ e.stopPropagation(); showDetail(d); highlight(d); });
svg.on("click", ()=>{ clearHL(); closeDetail(); });

node.append("title").text(d => d.type==="gang"
  ? `${d.label}\n${d.members}人 · ${d.risk}风险\n${d.biz}`
  : `${d.label}\n${d.area} · ${d.count}件\n${d.title}`);

sim.on("tick", ()=>{
  link.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
  node.attr("transform", d=>`translate(${d.x},${d.y})`);
});

// ── 高亮 ──
function highlight(d){
  const keep = new Set([d.id]);
  links.forEach(l=>{
    if(l.source.id===d.id) keep.add(l.target.id);
    if(l.target.id===d.id) keep.add(l.source.id);
  });
  if(d.type==="gang") nodes.forEach(n=>{ if(n.gang===d.id) keep.add(n.id); });
  if(d.type==="seller") { keep.add(d.gang); nodes.forEach(n=>{ if(n.gang===d.gang) keep.add(n.id); }); }
  node.classed("dim", n=>!keep.has(n.id));
  link.classed("dim", l=>!(keep.has(l.source.id)&&keep.has(l.target.id)));
  // 把保留下来的节点置顶，确保不被其它（已 dim 的）节点遮住
  node.filter(n=>keep.has(n.id)).raise();
}
function clearHL(){ node.classed("dim",false); link.classed("dim",false);
  document.querySelectorAll('.gang-card').forEach(c=>c.classList.remove('active')); }

// ── 详情面板 ──
const detail = document.getElementById('detail');
function closeDetail(){ detail.classList.remove('open'); }
function showDetail(d){
  detail.classList.add('open');
  if(d.type==="gang"){
    const members = nodes.filter(n=>n.gang===d.id);
    const segChips = Object.entries(d.segments).map(([k,v])=>`<span class="chip">${k} ×${v}</span>`).join('');
    const areaChips = Object.entries(d.areas).map(([k,v])=>`<span class="chip">${k} ${v}人</span>`).join('');
    const rows = members.map(m=>`<div class="seller-row">
      <div class="sname">${esc(m.label)} <span style="color:#8b949e;font-weight:400">· ${m.area} · ${m.count}件</span></div>
      <div class="stitle">${esc(m.title||'')}</div>
      ${m.link?`<a href="${m.link}" target="_blank">查看商品 ↗</a>`:''}
    </div>`).join('');
    detail.innerHTML = `<span class="close" onclick="closeDetail()">✕</span>
      <h2>${esc(d.label)}</h2>
      <span class="risk-tag" style="background:${d.color}33;color:${d.color}">${d.risk}风险 · ${d.members}人团伙</span>
      <div class="field"><div class="k">核心业务</div><div class="v">${esc(d.biz)}</div></div>
      <div class="field"><div class="k">地域分布</div><div class="v">${areaChips}</div></div>
      <div class="field"><div class="k">业务关键词</div><div class="v">${segChips}</div></div>
      <div class="field"><div class="k">成员卖家 (${members.length})</div>${rows}</div>`;
  } else {
    const segChips = (d.segment||[]).map(s=>`<span class="chip">${esc(s)}</span>`).join('');
    detail.innerHTML = `<span class="close" onclick="closeDetail()">✕</span>
      <h2>${esc(d.label)}</h2>
      <span class="risk-tag" style="background:${d.color}33;color:${d.color}">${d.risk}风险 · ${d.area}</span>
      <div class="field"><div class="k">在售/采集到</div><div class="v">${d.count} 件商品</div></div>
      <div class="field"><div class="k">业务标签</div><div class="v">${segChips}</div></div>
      <div class="field"><div class="k">样本标题</div><div class="v">${esc(d.title||'')}</div></div>
      ${d.image_fp?`<div class="field"><div class="k">图片指纹</div><div class="v"><span class="chip">${d.image_fp}</span></div></div>`:''}
      ${d.link?`<div class="field"><a href="${d.link}" target="_blank" style="color:#3fb950">查看商品 ↗</a></div>`:''}`;
  }
}
function esc(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// ── 左侧团伙列表 ──
const sidebar = document.getElementById('sidebar');
GRAPH.nodes.filter(n=>n.type==="gang").sort((a,b)=>b.members-a.members).forEach(gn=>{
  const card = document.createElement('div');
  card.className='gang-card'; card.style.borderLeftColor=gn.color;
  const areas = Object.entries(gn.areas).slice(0,2).map(([k,v])=>`${k}${v}`).join(' ');
  card.innerHTML=`<div class="name">${esc(gn.label)}</div>
    <div class="meta"><span class="badge" style="background:${gn.color}33;color:${gn.color}">${gn.risk}风险</span>${gn.members}人 · ${areas}</div>`;
  card.onclick=()=>{
    document.querySelectorAll('.gang-card').forEach(c=>c.classList.remove('active'));
    card.classList.add('active');
    showDetail(gn); highlight(gn); focusNode(gn);
  };
  sidebar.appendChild(card);
});

function focusNode(d){
  // 收集该团伙的所有节点，按包围盒居中（避免镜头飞到空白区）
  let pts;
  if(d.type==="gang"){
    pts = nodes.filter(n => n.id===d.id || n.gang===d.id);
  } else {
    pts = nodes.filter(n => n.id===d.id || n.gang===d.gang || n.id===d.gang);
  }
  pts = pts.filter(p => isFinite(p.x) && isFinite(p.y));
  if(pts.length===0) return;
  const xs = pts.map(p=>p.x), ys = pts.map(p=>p.y);
  const minX=Math.min.apply(null,xs), maxX=Math.max.apply(null,xs);
  const minY=Math.min.apply(null,ys), maxY=Math.max.apply(null,ys);
  const cx=(minX+maxX)/2, cy=(minY+maxY)/2;
  const bw=Math.max(maxX-minX,80), bh=Math.max(maxY-minY,80);
  const scale=Math.min(2, Math.max(0.4, 0.75*Math.min((W-620)/bw,(H-100)/bh)));
  const t=d3.zoomIdentity.translate(W/2,H/2).scale(scale).translate(-cx,-cy);
  svg.transition().duration(600).call(zoom.transform, t);
}

// ── 搜索 ──
document.getElementById('search').addEventListener('input', e=>{
  const q = e.target.value.trim().toLowerCase();
  if(!q){ clearHL(); return; }
  const match = new Set();
  nodes.forEach(n=>{
    const hay = ((n.label||'')+(n.biz||'')+(n.area||'')+(n.title||'')+(n.segment||[]).join('')).toLowerCase();
    if(hay.includes(q)) match.add(n.id);
  });
  node.classed("dim", n=>!match.has(n.id));
  link.classed("dim", true);
});

// ── 缩放按钮 ──
document.getElementById('zoomin').onclick=()=>svg.transition().call(zoom.scaleBy,1.4);
document.getElementById('zoomout').onclick=()=>svg.transition().call(zoom.scaleBy,0.7);
document.getElementById('reset').onclick=()=>{ svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity); clearHL(); document.getElementById('search').value=''; };
</script>
</body>
</html>
