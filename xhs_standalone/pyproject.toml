[project]
name = "xhs-crawler"
version = "1.0.0"
description = "小红书爬虫独立包（从 MediaCrawler 提取）"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "tenacity>=8.2.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "aiofiles>=23.0.0",
    "python-dotenv>=1.0.0",
    "humps>=0.2.2",
    "pyhumps>=3.8.0",
    "asyncmy>=0.2.9",
    "asyncpg>=0.29.0",
    "motor>=3.3.0",
    "redis>=5.0.0",
    "openpyxl>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]
